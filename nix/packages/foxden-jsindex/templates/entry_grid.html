      <div class="tile tile-{{file_kind}}">
        <a class="tile-link" href="{{file_url}}" title="{{file_name}}&#10;{{file_mtime}}&#10;{{file_size}}" {{{file_media}}}>
          <span class="tile-thumb">{{{file_thumb}}}</span>
          <span class="tile-name">{{file_name}}</span>
        </a>
        <span class="tile-actions">{{{file_actions}}}</span>
      </div>
