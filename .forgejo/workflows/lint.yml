name: Lint

on:
  # Unfiltered in PRs so it can be a required check
  pull_request:
  push:
    # Lock file bumps (ruff, nixfmt) are linted in their PR
    paths:
      - '.forgejo/workflows/lint.yml'
      - '**.nix'
      - '**.py'
      - '**/pyproject.toml'
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: lint-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    env:
      # Nix, uv and the Nix substituters come pre-configured in the runner image
      NIX_CONFIG: access-tokens = github.com=${{ secrets.EXT_GITHUB_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Lint nix
        run: |
          cd ./nix
          nix run --inputs-from . 'nixpkgs#nixfmt-tree' -- --ci
      - name: Lint python
        run: |
          uv run --project mikrotik ruff check
