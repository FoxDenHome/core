name: Lint

on:
  pull_request:
  push:
    paths-ignore:
      - terraform/.terraform.lock.hcl
      - mikrotik/uv.lock
      - nix/flake.lock
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: lint-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    env:
      # Nix, uv and the Nix substituters come pre-configured in the runner image
      NIX_CONFIG: access-tokens = github.com=${{ secrets.EXT_GITHUB_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Lint nix
        run: |
          cd ./nix
          nix run --inputs-from . 'nixpkgs#nixfmt-tree' -- --ci
      - name: Lint python
        run: |
          uv run --project mikrotik ruff check

      - uses: https://github.com/terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.65.0

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -c "${PWD}/terraform/.tflint.hcl" --recursive -f compact
