on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: lint-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/astral-sh/setup-uv@v9.0.0
        with:
          github-token: ${{ secrets.EXT_GITHUB_TOKEN }}
      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          nix_path: nixstable=flake:github:NixOS/nixpkgs/nixos-26.05
          github_access_token: ${{ secrets.EXT_GITHUB_TOKEN }}
          enable_kvm: false
          install_options: --no-daemon
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
            trusted-substituters = http://host.docker.internal:1111?trusted=true https://cache.nixos-cuda.org https://cache.nixos.org/
            substituters = http://host.docker.internal:1111?trusted=true https://cache.nixos-cuda.org https://cache.nixos.org/
      - name: Lint nix
        run: |
          cd ./nix
          nix run 'nixstable#nixfmt-tree' -- --ci
      - name: Lint mikrotik
        run: |
          cd ./mikrotik
          uv run ruff check

      - uses: https://github.com/terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.59.1

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -c "${PWD}/terraform/.tflint.hcl" --recursive -f compact
