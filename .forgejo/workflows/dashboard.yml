# Tests dashboard/ and builds its image in PRs. Pushing it to
# git.foxden.network/foxden/dashboard and deploying it to the routers happens
# in apply.yml once merged. Not named like the shared docker.yml template,
# which builds from the repo root.
name: Dashboard image

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '.forgejo/workflows/dashboard.yml'
      - 'dashboard/**'
      - '!dashboard/README.md'

jobs:
  dashboard:
    runs-on: ${{ vars.MANAGED_RUNNER_TAG || 'ubuntu-26.04' }}
    steps:
      - name: Check out the repo
        uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://data.forgejo.org/actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
          check-latest: true
          cache: false
      - name: Test
        working-directory: dashboard
        run: |
          make test
          go run ./cmd/foxden-dashboard -config config.json -check
      - run: start-docker
      - name: Build container image
        uses: https://data.forgejo.org/docker/build-push-action@v7
        with:
          context: dashboard
          platforms: linux/amd64,linux/arm64
          push: false
